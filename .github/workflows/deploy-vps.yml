# Déploiement vers le VPS Hostinger (31.97.196.145) — LE serveur qui sert
# stratedgepronos.fr depuis la migration du 21/05/2026.
# Principe : le code est déjà un clone git sur le VPS (deploy key read-only)
# -> on SSH et on fait un git pull. Simple, atomique, pas de rsync --delete.
#
# SECRETS À CRÉER (Settings -> Secrets and variables -> Actions) :
#   VPS_HOST     = 31.97.196.145
#   VPS_USER     = alex
#   VPS_PASSWORD = mot de passe SSH du user alex
name: Deploy to VPS (stratedgepronos.fr)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  validate-live90:
    name: Recette Live90 V4
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests moteur, imports et parseurs
        run: |
          python3 -m unittest discover -s live90/tests -p 'test_*.py'
          node live90/tests/test_parsers.cjs
          node live90/tests/test_collector.cjs
          node live90/tests/test_packball_flow.cjs
          node live90/tests/test_download_flow.cjs
      - name: Recette interface desktop et mobile
        run: |
          npm install --prefix "$RUNNER_TEMP/live90-ui" playwright@1.51.1 --no-audit --no-fund
          LIVE90_UI_MODULES="$RUNNER_TEMP/live90-ui/node_modules" LIVE90_UI_OUTPUT="$RUNNER_TEMP/live90-captures" node live90/tests/test_v4_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live90-v4-captures
          path: ${{ runner.temp }}/live90-captures
          retention-days: 7
  deploy:
    needs: validate-live90
    name: git pull sur le VPS
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -q && sudo apt-get install -y -q sshpass

      - name: Pull sur le VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Auth par clé dédiée (recommandé) si VPS_SSH_KEY existe, sinon mot de passe
          if [ -n "$VPS_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_CMD="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes"
          else
            SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
            export SSHPASS="$VPS_PASSWORD"
          fi
          $SSH_CMD alex@31.97.196.145 bash -s << 'REMOTE'
          set -e
          cd /var/www/stratedgepronos.fr/public_html
          echo "── Etat local avant pull ──"
          git status --porcelain | head -10
          # Repair the reviewed Lab/slate conflict before pull, preserving all other VPS edits.
          REPAIR_SCRIPT=$(mktemp /tmp/lab-sidebar-repair.XXXXXX.py)
          curl -fsSL "https://raw.githubusercontent.com/stratedgepronos-code/stratedge-site/${{ github.sha }}/ops/repair-lab-sidebar.py" -o "$REPAIR_SCRIPT"
          python3 "$REPAIR_SCRIPT" --root "$(git rev-parse --show-toplevel)"
          # --rebase : tolère les commits locaux faits sur le VPS (rejoués par-dessus)
          # --autostash : tolère les modifs locales non commitées
          git pull --rebase --autostash origin master
          python3 "$REPAIR_SCRIPT" --root "$(git rev-parse --show-toplevel)"
          rm -f "$REPAIR_SCRIPT"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "DEPLOY_ERROR: unresolved conflicts; deployment is not healthy" >&2
            git diff --name-only --diff-filter=U
            exit 1
          fi
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' admin/sidebar.php; then
            echo "DEPLOY_ERROR: sidebar contains conflict markers" >&2
            exit 1
          fi
          echo "── HEAD déployé ──"
          git log --oneline -3

          echo "── Patch Tennis UI ──"
          curl -fsSL "https://raw.githubusercontent.com/stratedgepronos-code/stratedge-site/master/ops/patch-tennis-ui-vps.sh?ts=$(date +%s)" -o /tmp/patch-tennis-ui-vps.sh
          chmod +x /tmp/patch-tennis-ui-vps.sh
          /tmp/patch-tennis-ui-vps.sh
          # Check the actual public assets, including bytes: a login page with HTTP 200 is not CSS.
          LAB_CHECK_DIR=$(mktemp -d /tmp/lab-assets.XXXXXX)
          for asset in lab.css lab.js; do
            curl --fail --silent --show-error --max-time 20 "https://stratedgepronos.fr/admin/football-lab/assets/$asset?v=${{ github.sha }}" -o "$LAB_CHECK_DIR/$asset"
            cmp "admin/football-lab/assets/$asset" "$LAB_CHECK_DIR/$asset"
          done
          rm -rf "$LAB_CHECK_DIR"
          echo "LAB_ASSETS_OK"
          REPO_ROOT=$(git rev-parse --show-toplevel)
          php "$REPO_ROOT/ops/check-lab-footystats.php" "$REPO_ROOT"
          # Remove only the discontinued GPT API job; preserve every other cron entry.
          GPT_CRON=$(mktemp /tmp/lab-gpt-cron.XXXXXX)
          (crontab -l 2>/dev/null || true) | sed '/# stratedge-lab-auto-context$/d' > "$GPT_CRON"
          crontab "$GPT_CRON"
          rm -f "$GPT_CRON"
          echo "GPT_CONTEXT_CRON_REMOVED"
          # Live90 s'exécute depuis /opt, hors du dépôt servi par nginx.
          # Tester puis sauvegarder et remplacer le moteur du module Live V4.
          python3 -m unittest discover -s "$REPO_ROOT/live90/tests" -p 'test_*.py'
          for page in "$REPO_ROOT/public_html/admin/slate/live90/"*.php "$REPO_ROOT/public_html/api/live90/"*.php; do php -l "$page"; done
          sudo -n bash "$REPO_ROOT/ops/deploy-live90-v4.sh" "$REPO_ROOT"
          sudo -n -u www-data php "$REPO_ROOT/ops/check-live90-v4.php" "$REPO_ROOT"
          REMOTE

      - name: Vérification code_version en prod
        run: |
          sleep 2
          curl -s -o /dev/null -w "HTTP %{http_code}\n" https://stratedgepronos.fr/ || true
