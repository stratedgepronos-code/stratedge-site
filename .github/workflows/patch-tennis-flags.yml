name: One-shot patch tennis country flags

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-tennis-flags.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tennis flag decorator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sidebar = Path('public_html/admin/sidebar.php')
          js_path = Path('public_html/admin/assets/tennis-country-flags.js')
          workflow = Path('.github/workflows/patch-tennis-flags.yml')

          marker = 'tennis-country-flags.js'
          include = '''\n<?php if (($pageActive ?? '') === 'edge-finder-tennis'): ?>\n<script defer src="/panel-x9k3m/assets/tennis-country-flags.js?v=20260725"></script>\n<?php endif; ?>\n'''

          text = sidebar.read_text(encoding='utf-8')
          if marker not in text:
              sidebar.write_text(text.rstrip() + include, encoding='utf-8')

          js_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.write_text(r'''(() => {
  'use strict';

  const COUNTRY_ALIASES = {
    FRA:'FR', FRANCE:'FR', FRENCH:'FR',
    KAZ:'KZ', KAZAKHSTAN:'KZ',
    CZE:'CZ', CZECHIA:'CZ', 'CZECH REPUBLIC':'CZ',
    ROU:'RO', ROMANIA:'RO', ROMANIAN:'RO',
    UKR:'UA', UKRAINE:'UA',
    USA:'US', 'UNITED STATES':'US', AMERICAN:'US',
    GBR:'GB', GB:'GB', 'UNITED KINGDOM':'GB', BRITISH:'GB', ENGLAND:'GB',
    ESP:'ES', SPAIN:'ES', SPANISH:'ES',
    ITA:'IT', ITALY:'IT', ITALIAN:'IT',
    GER:'DE', DEU:'DE', GERMANY:'DE', GERMAN:'DE',
    BEL:'BE', BELGIUM:'BE',
    NED:'NL', NLD:'NL', NETHERLANDS:'NL', DUTCH:'NL',
    SUI:'CH', CHE:'CH', SWITZERLAND:'CH', SWISS:'CH',
    AUT:'AT', AUSTRIA:'AT',
    POL:'PL', POLAND:'PL',
    POR:'PT', PRT:'PT', PORTUGAL:'PT', PORTUGUESE:'PT',
    BRA:'BR', BRAZIL:'BR', BRAZILIAN:'BR',
    ARG:'AR', ARGENTINA:'AR',
    CHI:'CL', CHL:'CL', CHILE:'CL',
    COL:'CO', COLOMBIA:'CO',
    ECU:'EC', ECUADOR:'EC',
    MEX:'MX', MEXICO:'MX',
    CAN:'CA', CANADA:'CA',
    AUS:'AU', AUSTRALIA:'AU',
    NZL:'NZ', 'NEW ZEALAND':'NZ',
    JPN:'JP', JAPAN:'JP',
    CHN:'CN', CHINA:'CN',
    KOR:'KR', 'SOUTH KOREA':'KR', KOREA:'KR',
    IND:'IN', INDIA:'IN',
    SRB:'RS', SERBIA:'RS',
    CRO:'HR', HRV:'HR', CROATIA:'HR',
    SLO:'SI', SVN:'SI', SLOVENIA:'SI',
    SVK:'SK', SLOVAKIA:'SK',
    BUL:'BG', BGR:'BG', BULGARIA:'BG',
    GRE:'GR', GRC:'GR', GREECE:'GR',
    TUR:'TR', TURKEY:'TR', TURKIYE:'TR',
    ISR:'IL', ISRAEL:'IL',
    TUN:'TN', TUNISIA:'TN',
    MAR:'MA', MOR:'MA', MOROCCO:'MA',
    RSA:'ZA', ZAF:'ZA', 'SOUTH AFRICA':'ZA',
    EGY:'EG', EGYPT:'EG',
    BLR:'BY', BELARUS:'BY',
    LTU:'LT', LITHUANIA:'LT',
    LAT:'LV', LVA:'LV', LATVIA:'LV',
    EST:'EE', ESTONIA:'EE',
    DEN:'DK', DNK:'DK', DENMARK:'DK',
    SWE:'SE', SWEDEN:'SE',
    NOR:'NO', NORWAY:'NO',
    FIN:'FI', FINLAND:'FI',
    IRL:'IE', IRELAND:'IE',
    HUN:'HU', HUNGARY:'HU',
    GEO:'GE', GEORGIA:'GE',
    ARM:'AM', ARMENIA:'AM',
    UZB:'UZ', UZBEKISTAN:'UZ',
    MDA:'MD', MOLDOVA:'MD',
    BIH:'BA', BOSNIA:'BA', 'BOSNIA AND HERZEGOVINA':'BA',
    MNE:'ME', MONTENEGRO:'ME',
    MKD:'MK', MACEDONIA:'MK', 'NORTH MACEDONIA':'MK',
    CYP:'CY', CYPRUS:'CY',
    THA:'TH', THAILAND:'TH',
    TPE:'TW', TAIWAN:'TW'
  };

  const PLAYER_SELECTORS = [
    '[data-country]', '[data-country-code]', '[data-nationality]', '[data-ioc]',
    '.player-name', '.player_name', '.tennis-player', '.tennis-player-name',
    '.competitor-name', '.competitor', '.match-player', '.candidate-player',
    '.ef-player', '.ef-player-name', '.player', '.participant-name'
  ].join(',');

  const ATTRS = ['data-country', 'data-country-code', 'data-nationality', 'data-ioc', 'title', 'aria-label'];

  function flagEmoji(code) {
    const iso = String(code || '').trim().toUpperCase();
    if (!/^[A-Z]{2}$/.test(iso)) return '';
    return String.fromCodePoint(...[...iso].map(c => 127397 + c.charCodeAt(0)));
  }

  function normalizeCountry(raw) {
    if (!raw) return '';
    const clean = String(raw)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase().trim()
      .replace(/[._-]+/g, ' ')
      .replace(/\s+/g, ' ');
    if (COUNTRY_ALIASES[clean]) return COUNTRY_ALIASES[clean];
    if (/^[A-Z]{2}$/.test(clean)) return clean;
    if (/^[A-Z]{3}$/.test(clean) && COUNTRY_ALIASES[clean]) return COUNTRY_ALIASES[clean];
    return '';
  }

  function countryFromElement(el) {
    for (const attr of ATTRS) {
      const iso = normalizeCountry(el.getAttribute?.(attr));
      if (iso) return iso;
    }

    const hay = (el.textContent || '').toUpperCase();
    const tokens = hay.match(/\b[A-Z]{2,3}\b/g) || [];
    for (const token of tokens) {
      const iso = normalizeCountry(token);
      if (iso) return iso;
    }

    for (const [alias, iso] of Object.entries(COUNTRY_ALIASES)) {
      if (alias.length > 3 && hay.includes(alias)) return iso;
    }
    return '';
  }

  function decorate(el) {
    if (!(el instanceof HTMLElement)) return;
    if (el.closest('#sidebar, .mobile-topbar, .admin-mob-tabs')) return;
    if (el.dataset.flagDecorated === '1' || el.querySelector(':scope > .tennis-country-flag')) return;

    const iso = countryFromElement(el);
    if (!iso) return;
    const flag = flagEmoji(iso);
    if (!flag) return;

    const span = document.createElement('span');
    span.className = 'tennis-country-flag';
    span.textContent = flag;
    span.title = iso;
    span.setAttribute('aria-label', `Pays ${iso}`);
    el.prepend(span);
    el.dataset.flagDecorated = '1';
  }

  function scan(root = document) {
    if (root instanceof HTMLElement && root.matches(PLAYER_SELECTORS)) decorate(root);
    root.querySelectorAll?.(PLAYER_SELECTORS).forEach(decorate);
  }

  const style = document.createElement('style');
  style.textContent = `
    .tennis-country-flag {
      display: inline-block;
      margin-right: .42em;
      font-size: .95em;
      line-height: 1;
      vertical-align: -.04em;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.35));
    }
  `;
  document.head.appendChild(style);

  const start = () => {
    scan();
    const observer = new MutationObserver(records => {
      for (const record of records) {
        for (const node of record.addedNodes) {
          if (node instanceof HTMLElement) scan(node);
        }
      }
    });
    observer.observe(document.body, {childList: true, subtree: true});
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
  else start();
})();
''', encoding='utf-8')

          # Workflow one-shot : il se supprime de la branche après avoir posé le patch.
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "StratEdge Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_html/admin/sidebar.php public_html/admin/assets/tennis-country-flags.js .github/workflows/patch-tennis-flags.yml
          git commit -m "feat(tennis): afficher les drapeaux devant les joueurs"
          git push origin master
