name: Inspect Lab display
on:
  push:
    branches: ['codex/lab-display-inspect']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect sidebar conflict and document root
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/stratedgepronos.fr/public_html
          git rev-parse --show-toplevel
          git diff --name-only --diff-filter=U
          git diff -- public_html/admin/sidebar.php
          ls -ld admin admin/football-lab public_html/admin/football-lab 2>/dev/null || true
          REMOTE
