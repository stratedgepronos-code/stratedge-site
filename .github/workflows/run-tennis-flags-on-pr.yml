name: Apply tennis flags patch

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/tennis-flags-trigger'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch tracked site files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sidebar = Path('public_html/admin/sidebar.php')
          js_path = Path('public_html/admin/assets/tennis-country-flags.js')
          marker = 'tennis-country-flags.js'
          include = '''\n<?php if (($pageActive ?? '') === 'edge-finder-tennis'): ?>\n<script defer src="/panel-x9k3m/assets/tennis-country-flags.js?v=20260725"></script>\n<?php endif; ?>\n'''

          text = sidebar.read_text(encoding='utf-8')
          if marker not in text:
              sidebar.write_text(text.rstrip() + include, encoding='utf-8')

          js_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.write_text(r'''(() => {
  'use strict';

  const ALIASES = {
    FRA:'FR', FRANCE:'FR', KAZ:'KZ', KAZAKHSTAN:'KZ', CZE:'CZ', CZECHIA:'CZ',
    ROU:'RO', ROMANIA:'RO', UKR:'UA', UKRAINE:'UA', USA:'US', GBR:'GB', GB:'GB',
    ESP:'ES', SPAIN:'ES', ITA:'IT', ITALY:'IT', GER:'DE', DEU:'DE', GERMANY:'DE',
    BEL:'BE', BELGIUM:'BE', NED:'NL', NLD:'NL', NETHERLANDS:'NL', SUI:'CH', CHE:'CH',
    SWITZERLAND:'CH', AUT:'AT', AUSTRIA:'AT', POL:'PL', POLAND:'PL', POR:'PT', PRT:'PT',
    PORTUGAL:'PT', BRA:'BR', BRAZIL:'BR', ARG:'AR', ARGENTINA:'AR', CHI:'CL', CHL:'CL',
    CHILE:'CL', COL:'CO', COLOMBIA:'CO', ECU:'EC', ECUADOR:'EC', MEX:'MX', MEXICO:'MX',
    CAN:'CA', CANADA:'CA', AUS:'AU', AUSTRALIA:'AU', NZL:'NZ', JPN:'JP', JAPAN:'JP',
    CHN:'CN', CHINA:'CN', KOR:'KR', INDIA:'IN', IND:'IN', SRB:'RS', SERBIA:'RS',
    CRO:'HR', HRV:'HR', CROATIA:'HR', SLO:'SI', SVN:'SI', SLOVENIA:'SI', SVK:'SK',
    SLOVAKIA:'SK', BUL:'BG', BGR:'BG', BULGARIA:'BG', GRE:'GR', GRC:'GR', GREECE:'GR',
    TUR:'TR', TURKEY:'TR', ISR:'IL', ISRAEL:'IL', TUN:'TN', TUNISIA:'TN', MAR:'MA',
    MOR:'MA', MOROCCO:'MA', RSA:'ZA', ZAF:'ZA', EGY:'EG', EGYPT:'EG', BLR:'BY',
    BELARUS:'BY', LTU:'LT', LITHUANIA:'LT', LAT:'LV', LVA:'LV', LATVIA:'LV', EST:'EE',
    ESTONIA:'EE', DEN:'DK', DNK:'DK', DENMARK:'DK', SWE:'SE', SWEDEN:'SE', NOR:'NO',
    NORWAY:'NO', FIN:'FI', FINLAND:'FI', IRL:'IE', IRELAND:'IE', HUN:'HU', HUNGARY:'HU',
    GEO:'GE', GEORGIA:'GE', ARM:'AM', ARMENIA:'AM', UZB:'UZ', UZBEKISTAN:'UZ',
    MDA:'MD', MOLDOVA:'MD', BIH:'BA', BOSNIA:'BA', MNE:'ME', MONTENEGRO:'ME',
    MKD:'MK', MACEDONIA:'MK', CYP:'CY', CYPRUS:'CY', THA:'TH', THAILAND:'TH', TPE:'TW'
  };

  const SELECTORS = [
    '[data-country]','[data-country-code]','[data-nationality]','[data-ioc]',
    '.player-name','.player_name','.tennis-player','.tennis-player-name',
    '.competitor-name','.competitor','.match-player','.candidate-player',
    '.ef-player','.ef-player-name','.player','.participant-name'
  ].join(',');
  const ATTRS = ['data-country','data-country-code','data-nationality','data-ioc','title','aria-label'];

  function normalize(raw) {
    if (!raw) return '';
    const clean = String(raw).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toUpperCase().trim().replace(/[._-]+/g,' ').replace(/\s+/g,' ');
    return ALIASES[clean] || (/^[A-Z]{2}$/.test(clean) ? clean : '');
  }

  function flag(iso) {
    return /^[A-Z]{2}$/.test(iso)
      ? String.fromCodePoint(...[...iso].map(c => 127397 + c.charCodeAt(0))) : '';
  }

  function detect(el) {
    for (const attr of ATTRS) {
      const iso = normalize(el.getAttribute?.(attr));
      if (iso) return iso;
    }
    const text = (el.textContent || '').toUpperCase();
    for (const token of (text.match(/\b[A-Z]{2,3}\b/g) || [])) {
      const iso = normalize(token);
      if (iso) return iso;
    }
    for (const [alias, iso] of Object.entries(ALIASES)) {
      if (alias.length > 3 && text.includes(alias)) return iso;
    }
    return '';
  }

  function decorate(el) {
    if (!(el instanceof HTMLElement) || el.closest('#sidebar,.mobile-topbar,.admin-mob-tabs')) return;
    if (el.dataset.flagDecorated === '1') return;
    const iso = detect(el), emoji = flag(iso);
    if (!emoji) return;
    const span = document.createElement('span');
    span.className = 'tennis-country-flag';
    span.textContent = emoji;
    span.title = iso;
    el.prepend(span);
    el.dataset.flagDecorated = '1';
  }

  function scan(root=document) {
    if (root instanceof HTMLElement && root.matches(SELECTORS)) decorate(root);
    root.querySelectorAll?.(SELECTORS).forEach(decorate);
  }

  const style = document.createElement('style');
  style.textContent = '.tennis-country-flag{display:inline-block;margin-right:.42em;font-size:.95em;line-height:1;vertical-align:-.04em;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}';
  document.head.appendChild(style);

  const start = () => {
    scan();
    new MutationObserver(records => records.forEach(r => r.addedNodes.forEach(n => {
      if (n instanceof HTMLElement) scan(n);
    }))).observe(document.body,{childList:true,subtree:true});
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded',start,{once:true}) : start();
})();
''', encoding='utf-8')

          for path in [Path('.github/workflows/patch-tennis-flags.yml'), Path('.github/workflows/run-tennis-flags-on-pr.yml')]:
              if path.exists():
                  path.unlink()
          PY

      - name: Commit patch to master
        run: |
          git config user.name "StratEdge Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(tennis): afficher les drapeaux devant les joueurs"
          git push origin master

      - name: Deploy directly to VPS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sshpass
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -e
          cd /var/www/stratedgepronos.fr/public_html
          git stash push -m "tennis-flags-autostash $(date +%F-%H%M)" || true
          git pull --ff-only origin master
          git stash pop || true
          php -l admin/sidebar.php
          test -f admin/assets/tennis-country-flags.js
          echo "TENNIS_FLAGS_DEPLOYED $(git rev-parse --short HEAD)"
          REMOTE
