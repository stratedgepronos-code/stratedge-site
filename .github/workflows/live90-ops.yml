name: Live90 installation checks
on:
  push:
    branches: ['codex/live90-ops']
    paths: ['.github/workflows/live90-ops.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier les prérequis sans modifier les services
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 150 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -e
          echo LIVE90_PREFLIGHT
          php -r 'echo "PHP ".PHP_VERSION." sqlite=".(extension_loaded("pdo_sqlite")?"yes":"no").PHP_EOL;'
          python3 --version
          if sudo -n true 2>/dev/null; then echo SUDO_AVAILABLE=yes; else echo SUDO_AVAILABLE=no; fi
          for p in /etc/stratedge/live.env /var/www/stratedgepronos.fr/public_html/admin/slate/live90 /var/www/stratedgepronos.fr/public_html/api/live90 /opt/stratedge/live90 /etc/systemd/system/seuil90-live.service; do
           if test -e "$p"; then echo "EXISTS $p"; else echo "ABSENT $p"; fi
          done
          if sudo -n true 2>/dev/null; then
           sudo -n -u www-data php -r '$p="/etc/stratedge/live.env";$c=is_readable($p)?parse_ini_file($p,false,INI_SCANNER_RAW):[];echo "ENV_READABLE=".(is_readable($p)?"yes":"no")." TOKEN_SET=".(!empty($c["SE_LIVE_TOKEN"])?"yes":"no").PHP_EOL;'
           sudo -n sh -c 'ls /etc/php/*/fpm/conf.d/*sqlite* 2>/dev/null || true'
          fi
          systemctl is-active stratedge-live.service || true
          
          REMOTE
