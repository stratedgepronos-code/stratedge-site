name: Enregistrer la nouvelle analyse diagnostiquée du Football Lab
on:
  push:
    branches: ['codex/lab-sept17-audit']
    paths: ['.github/workflows/lab-sept17-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Créer une nouvelle version sans modifier l’archive originale
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 100 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          timeout 65 php <<'PHP'
          <?php
          $orig='/var/www/stratedgepronos.fr/public_html/admin/football-lab';
          require '/var/www/stratedgepronos.fr/public_html/includes/db.php';
          require $orig.'/lib/Engine.php';require $orig.'/lib/Store.php';require $orig.'/lib/PackBall.php';
          if(\StratEdgeLab\DecisionEngine::FOOTY_VERSION!=='2.2.0-footystats-diagnostics-experimental'){echo "LAB_SAVE deployment_not_ready\n";exit(1);}
          $id='a57fb13a60a9f2f11e94395f5984f6f8';
          $q=getDB()->prepare('SELECT owner_id,payload FROM se_lab_runs WHERE id=?');$q->execute([$id]);$row=$q->fetch(PDO::FETCH_ASSOC);$raw=$row['payload'];$d=json_decode($raw,true);$owner=(int)$row['owner_id'];
          $store=new \StratEdgeLab\Store(getDB());
          foreach($store->recent($owner) as $recent){
           $old=$store->get($recent['id'],$owner)['data'];
           if(($old['reanalysis_of']??'')===$id&&($old['analysis']['version']??'')===\StratEdgeLab\DecisionEngine::FOOTY_VERSION){echo 'LAB_SAVED '.json_encode(['id'=>$recent['id'],'already_exists'=>true]).PHP_EOL;exit;}
          }
          $prepared=\StratEdgeLab\PackBall::replay($d,\StratEdgeLab\FootyStats::configured($store));
          $prepared['reanalysis_of']=$id;
          $newId=$store->create('analysis',$prepared,$owner);
          $counts=[];$historical=0;
          foreach($prepared['analysis']['matches'] as $m){
           $category=\StratEdgeLab\DecisionEngine::diagnostic($m)['category'];$counts[$category]=($counts[$category]??0)+1;
           if(($m['historical_context']['status']??'')==='descriptive_only')$historical++;
          }
          $q->execute([$id]);$again=$q->fetch(PDO::FETCH_ASSOC);
          echo 'LAB_SAVED '.json_encode(['id'=>$newId,'count'=>count($prepared['analysis']['matches']),'categories'=>$counts,'history_count'=>$historical,'version'=>$prepared['analysis']['version'],'archive_unchanged'=>hash('sha256',$raw)===hash('sha256',$again['payload'])]).PHP_EOL;
          
          PHP
          REMOTE
