name: Read-only Live storage diagnostic
on:
  push:
    branches: [audit-live-storage-20261109]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install sshpass
        run: sudo apt-get update -q && sudo apt-get install -y -q sshpass
      - name: Read storage and service state
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -n "$VPS_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/diagnostic_key
            chmod 600 ~/.ssh/diagnostic_key
            SSH_CMD="ssh -i $HOME/.ssh/diagnostic_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o IdentitiesOnly=yes"
          else
            SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
            export SSHPASS="$VPS_PASSWORD"
          fi
          $SSH_CMD alex@31.97.196.145 bash -s << 'REMOTE'
          set -e
          date -u
          df -B1 /
          ps -eo pid,etime,pcpu,pmem,comm | awk 'NR==1 || $5 ~ /python|gzip|ssh/'
          sudo -n find /var/backups -maxdepth 2 -type f -name '*.partial' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n'
          sudo -n find /var/backups -maxdepth 2 -type f -name '*.recompression.json' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n'
          sudo -n systemctl is-active seuil90-live.service
          sudo -n stat -c '%y %s %n' /opt/stratedge/live90/live_v4.py /var/lib/stratedge/live90.sqlite
          REMOTE
