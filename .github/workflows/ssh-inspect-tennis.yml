name: SSH inspect tennis module

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/ssh-inspect-trigger.txt'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -q && sudo apt-get install -y -q sshpass

      - name: Inspect live tennis module
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -n "$VPS_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_CMD="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes"
          else
            export SSHPASS="$VPS_PASSWORD"
            SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          fi

          $SSH_CMD alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -eu
          BASE=/var/www/stratedgepronos.fr/public_html/admin
          MOD="$BASE/edge-finder-tennis"
          INDEX="$MOD/index.php"
          echo "=== FILES ==="
          find "$MOD" -maxdepth 2 -type f -printf '%f\n' | sort
          echo "=== PATCH FILES ==="
          for f in "$BASE/.user.ini" "$BASE/tennis-flags-append.php" "$BASE/assets/tennis-country-flags.js"; do
            if [ -f "$f" ]; then echo "OK $f $(stat -c%s "$f") bytes"; else echo "MISSING $f"; fi
          done
          echo "=== INDEX MATCHES ==="
          grep -nEi 'filter|filtre|player|joueur|country|national|sticky|position:' "$INDEX" | head -120 || true
          echo "=== CSS MATCHES ==="
          find "$MOD" -maxdepth 2 -type f -name '*.css' -print0 | xargs -0 -r grep -nEi 'filter|filtre|sticky|position:' | head -120 || true
          echo "=== CONTEXTS ==="
          python3 - "$INDEX" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          lines = p.read_text(encoding='utf-8', errors='replace').splitlines()
          rx = re.compile(r'filter|filtre|player|joueur|country|national|sticky|position:', re.I)
          hits = [i for i, line in enumerate(lines) if rx.search(line)]
          chosen=[]
          for i in hits:
              if not chosen or i-chosen[-1] > 12:
                  chosen.append(i)
          for i in chosen[:18]:
              print(f'--- around line {i+1} ---')
              for j in range(max(0,i-5), min(len(lines),i+9)):
                  print(f'{j+1:04d}: {lines[j]}')
          PY
          REMOTE
