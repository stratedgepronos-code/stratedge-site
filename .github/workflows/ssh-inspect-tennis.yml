name: SSH inspect tennis odds pipeline

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/ssh-inspect-trigger.txt'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live tennis odds pipeline
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -u
          WEB=/var/www/stratedgepronos.fr/public_html/admin/edge-finder-tennis

          echo '=== TENNIS SYSTEMD TIMERS ==='
          systemctl list-timers --all --no-pager 2>/dev/null | grep -i tennis || true

          echo '=== TENNIS SYSTEMD SERVICES ==='
          systemctl list-units --all --type=service --no-pager 2>/dev/null | grep -i tennis || true

          echo '=== TENNIS UNIT DETAILS ==='
          systemctl list-unit-files --type=service --no-legend 2>/dev/null \
            | awk 'tolower($1) ~ /tennis/ {print $1}' \
            | while read -r unit; do
                echo "--- $unit ---"
                systemctl show "$unit" \
                  -p FragmentPath -p WorkingDirectory -p ExecStart -p EnvironmentFiles \
                  --no-pager 2>/dev/null || true
              done

          echo '=== COCKPIT ODDS SQL REFERENCES ==='
          grep -nEi 'odds|price|book|cote|FROM |JOIN |player1_|player2_' "$WEB/cockpit.php" \
            | head -260 || true

          echo '=== RELEVANT TENNIS FILES ==='
          find /home/alex /opt /var/www/stratedgepronos.fr \
            -maxdepth 6 -type f \
            \( -iname '*tennis*' -o -iname '*odds*' -o -iname '*baseline*' \) \
            -not -path '*/.git/*' -not -path '*/node_modules/*' -not -path '*/vendor/*' \
            -printf '%TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null \
            | sort -r | head -220 || true

          echo '=== ODDS INGESTION CODE REFERENCES ==='
          for root in /home/alex /opt /var/www/stratedgepronos.fr/public_html/admin/edge-finder-tennis; do
            [ -d "$root" ] || continue
            grep -RniE \
              'price_missing|prix manquant|cotes en attente|bookmaker|odds|moneyline|player1_odds|player2_odds|tennis_odds|market_key|event_id|match_id' \
              "$root" \
              --include='*.py' --include='*.php' --include='*.sh' --include='*.service' --include='*.timer' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=vendor --exclude-dir=.venv \
              2>/dev/null | head -500 || true
          done

          echo '=== RECENT TENNIS LOGS ==='
          systemctl list-unit-files --type=service --no-legend 2>/dev/null \
            | awk 'tolower($1) ~ /tennis/ {print $1}' \
            | while read -r unit; do
                echo "--- journal $unit ---"
                journalctl -u "$unit" -n 80 --no-pager 2>/dev/null \
                  | grep -Ei 'odds|cote|price|match|missing|reject|skip|error|warning|import|upsert|pair' \
                  | tail -50 || true
              done

          echo 'INSPECT_ODDS_OK'
          REMOTE
