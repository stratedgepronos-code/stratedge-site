name: SSH verify tennis UI

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/ssh-inspect-trigger.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live tennis UI
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -eu
          BASE=/var/www/stratedgepronos.fr/public_html/admin
          WRAPPER="$BASE/edge-finder-tennis/index.php"
          CSS="$BASE/edge-finder-tennis/assets/tennis-v4.css"
          JS="$BASE/assets/tennis-country-flags.js"
          echo "=== TENNIS UI VERIFY ==="
          grep -n 'tennis-country-flags.js?v=20260725-iframe4' "$WRAPPER" || true
          grep -n 'STRATEDGE_MOBILE_FILTER_STATIC_START' "$CSS" || true
          grep -n 'setupDocument' "$JS" | head -2 || true
          echo "=== BACKUPS ==="
          find "$BASE/edge-finder-tennis/.backups" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | tail -5 || true
          echo "=== SIZES ==="
          stat -c '%n %s bytes' "$WRAPPER" "$CSS" "$JS"
          REMOTE
