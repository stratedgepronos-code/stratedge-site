name: SSH inspect tennis module

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/ssh-inspect-trigger.txt'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live tennis module
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -eu
          BASE=/var/www/stratedgepronos.fr/public_html/admin
          MOD="$BASE/edge-finder-tennis"
          INDEX="$MOD/index.php"
          echo "=== PATCH FILES ==="
          for f in "$BASE/.user.ini" "$BASE/tennis-flags-append.php" "$BASE/assets/tennis-country-flags.js"; do
            if [ -f "$f" ]; then echo "OK $f $(stat -c%s "$f") bytes"; else echo "MISSING $f"; fi
          done
          echo "=== INDEX MATCHES ==="
          grep -nEi 'filter|filtre|player|joueur|country|national|sticky|position:' "$INDEX" | head -90 || true
          echo "=== CSS MATCHES ==="
          find "$MOD" -maxdepth 2 -type f -name '*.css' -print0 | xargs -0 -r grep -nEi 'filter|filtre|sticky|position:' | head -90 || true
          echo "=== TARGET CONTEXTS ==="
          python3 - "$INDEX" <<'PY'
          import re, sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          rx = re.compile(r'filter|filtre|player|joueur|country|national|sticky|position:', re.I)
          hits = [i for i, line in enumerate(lines) if rx.search(line)]
          chosen=[]
          for i in hits:
              if not chosen or i-chosen[-1] > 18:
                  chosen.append(i)
          for i in chosen[:12]:
              print(f'--- around line {i+1} ---')
              for j in range(max(0,i-4), min(len(lines),i+7)):
                  print(f'{j+1:04d}: {lines[j]}')
          PY
          REMOTE
