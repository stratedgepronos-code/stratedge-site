name: SSH inspect tennis module

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/ssh-inspect-trigger.txt'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live tennis module
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -eu
          MOD=/var/www/stratedgepronos.fr/public_html/admin/edge-finder-tennis
          INDEX="$MOD/index.php"
          CSS="$MOD/assets/tennis-v4.css"
          echo "=== INDEX 45-115 ==="
          sed -n '45,115p' "$INDEX"
          echo "=== TOOLBAR MARKUP ==="
          grep -n -A28 -B8 'class="toolbar' "$INDEX" | head -90 || true
          echo "=== TOOLBAR CSS RULES ==="
          python3 - "$CSS" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          text = text.replace('}', '}\n')
          for line in text.splitlines():
              if re.search(r'toolbar|filter|@media', line, re.I):
                  print(line[:1800])
          PY
          echo "=== SCRIPT TAIL ==="
          tail -55 "$INDEX"
          REMOTE
