name: SSH verify tennis UI

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/ssh-inspect-trigger.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live tennis UI
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/var/www/stratedgepronos.fr/public_html/admin
          SIDEBAR="$BASE/sidebar.php"
          FLAGS="$BASE/assets/tennis-country-flags.js"
          BOOTSTRAP="$BASE/assets/tennis-ui-bootstrap.js"

          grep -n 'STRATEDGE_TENNIS_UI_BOOTSTRAP_START' "$SIDEBAR"
          grep -n 'tennis-ui-bootstrap.js?v=20260725-2' "$SIDEBAR"
          grep -n 'setupDocument' "$FLAGS" | head -2
          grep -n 'stratedge-tennis-mobile-filter-static' "$BOOTSTRAP"
          grep -n 'position: static !important' "$BOOTSTRAP"
          php -l "$SIDEBAR"
          stat -c '%n %s bytes %U:%G %a' "$SIDEBAR" "$FLAGS" "$BOOTSTRAP"
          echo VERIFY_OK
          REMOTE
