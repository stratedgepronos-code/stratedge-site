name: SSH inspect exact tennis patch points

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/ssh-inspect-trigger.txt'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact PHP and CSS patch points
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -eu
          MOD=/var/www/stratedgepronos.fr/public_html/admin/edge-finder-tennis
          echo '=== COCKPIT HEAD 1-90 ==='
          sed -n '1,90p' "$MOD/cockpit.php"
          echo '=== PLAYER MARKUP 312-330 ==='
          sed -n '312,330p' "$MOD/cockpit.php"
          echo '=== TOOLBAR RULES ==='
          python3 - "$MOD/assets/tennis-v4.css" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').replace('}', '}\n')
          for line in text.splitlines():
              if re.search(r'(^|[,{])\s*\.toolbar|filter-form|@media', line, re.I):
                  print(line[:3000])
          PY
          echo '=== STATIC ASSET URLS ==='
          for url in \
            'https://stratedgepronos.fr/panel-x9k3m/assets/tennis-ui-force.js?v=20260725-force3' \
            'https://stratedgepronos.fr/admin/assets/tennis-ui-force.js?v=20260725-force3'; do
            code=$(curl -L -sS -o /tmp/asset.out -w '%{http_code}' "$url" || true)
            echo "$code $url size=$(wc -c </tmp/asset.out 2>/dev/null || echo 0)"
          done
          REMOTE
