name: StratEdge Lab checks
on:
  pull_request:
    paths:
      - 'public_html/admin/football-lab/**'
      - 'public_html/admin/sidebar.php'
      - 'tests/football-lab/**'
      - 'ops/repair-lab-sidebar.py'
      - '.github/workflows/deploy-vps.yml'
      - '.github/workflows/football-lab-checks.yml'
  push:
    branches: ['codex/stratedge-lab', 'codex/lab-design', 'codex/packball-one-file']
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP and SQLite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3
      - name: PHP syntax
        run: |
          find public_html/admin/football-lab tests/football-lab -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l public_html/admin/sidebar.php
      - name: Import, probabilities, storage and tracking
        env:
          LAB_RENDER_DIR: /tmp/lab-render
        run: php tests/football-lab/run.php
      - name: Synthetic preview exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          for p in Path('/tmp/lab-render').glob('*.html'):
              print('LAB_PREVIEW ' + p.name + ' ' + base64.b64encode(gzip.compress(p.read_bytes())).decode())
          PY
      - name: JavaScript syntax
        run: node --check public_html/admin/football-lab/assets/lab.js
      - name: Preserve local sidebar changes during repair
        run: python3 tests/football-lab/test_sidebar_repair.py
