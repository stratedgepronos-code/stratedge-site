name: Lab FootyStats diagnostic
on:
  push:
    branches: ['codex/lab-footy-diagnostics']
    paths: ['.github/workflows/lab-footy-diagnostic.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reanalyze the affected PackBall import and report coverage
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/stratedgepronos.fr/public_html
          php <<'PHP'
          <?php
          try {
              require 'includes/db.php';
              require 'admin/football-lab/lib/Engine.php';
              require 'admin/football-lab/lib/PackBall.php';
              require 'admin/football-lab/lib/Store.php';
              $db = getDB();
              $q = $db->prepare("SELECT r.id, r.owner_id, r.payload FROM se_lab_runs r JOIN membres m ON m.id = r.owner_id WHERE m.email = ? AND r.kind = 'analysis' ORDER BY r.created_at DESC LIMIT 1");
              $q->execute([ADMIN_EMAIL]); $source = $q->fetch(PDO::FETCH_ASSOC);
              if (!$source) { echo "LAB_REPLAY_NO_SOURCE\n"; exit(2); }
              $data = json_decode($source['payload'], true, 512, JSON_THROW_ON_ERROR);
              $store = new \StratEdgeLab\Store($db);
              $created = false;
              if (($data['analysis']['version']??'') === '2.1.0-footystats-venue-experimental' && ($data['analysis']['footystats']['enriched']??null) === 0) {
                  $prepared = \StratEdgeLab\PackBall::replay($data, \StratEdgeLab\FootyStats::configured($store));
                  if (($prepared['analysis']['footystats']['enriched']??0) < 1) { echo "LAB_REPLAY_NO_ENRICHMENT\n"; exit(3); }
                  $prepared['retry_of'] = $source['id'];
                  $store->create('analysis', $prepared, (int)$source['owner_id']);
                  $data = $prepared; $created = true;
              }
              $a = $data['analysis'];
              echo 'LAB_REPLAY_RESULT ' . json_encode(['new_analysis'=>$created,'matches'=>count($a['matches']),'enriched'=>$a['footystats']['enriched']??0,'unavailable'=>$a['footystats']['unavailable']??0,'picks'=>count(array_filter($a['matches'],static function ($m) { return $m['pick']!==null; }))],JSON_UNESCAPED_UNICODE) . "\n";
              foreach ($a['matches'] as $m) {
                  if (($m['footystats']['status']??'') !== 'enriched') { echo 'LAB_REMAINING ' . json_encode(['home'=>$m['home'],'away'=>$m['away'],'message'=>$m['footystats']['message']??''],JSON_UNESCAPED_UNICODE) . "\n"; }
              }
          } catch (Throwable $e) { echo "LAB_REPLAY_FAILED\n"; exit(2); }
          PHP
          REMOTE
