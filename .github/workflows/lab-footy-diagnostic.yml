name: Lab FootyStats diagnostic
on:
  push:
    branches: ['codex/lab-footy-diagnostics']
    paths: ['.github/workflows/lab-footy-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read sanitized Lab rejection diagnostics
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o IdentitiesOnly=yes alex@31.97.196.145 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/stratedgepronos.fr/public_html
          DIAG_FILE=$(mktemp /tmp/lab-footy-check.XXXXXX.php)
          trap 'rm -f "$DIAG_FILE"' EXIT
          curl -fsSL "https://raw.githubusercontent.com/stratedgepronos-code/stratedge-site/90bb6442d9273495bd31fbe00fab9a8dad0a7314/public_html/admin/football-lab/lib/FootyStats.php" -o "$DIAG_FILE"
          export FOOTY_DIAG_LIBRARY="$DIAG_FILE"
          php <<'PHP'
          <?php
          try {
              require 'includes/db.php';
              if (is_readable('config-keys.php')) { require_once 'config-keys.php'; }
              require 'admin/football-lab/lib/Store.php';
              require getenv('FOOTY_DIAG_LIBRARY');
              $db = getDB();
              $q = $db->prepare("SELECT r.payload FROM se_lab_runs r JOIN membres m ON m.id = r.owner_id WHERE m.email = ? AND r.kind = 'analysis' ORDER BY r.created_at DESC LIMIT 1");
              $q->execute([ADMIN_EMAIL]);
              $payload = $q->fetchColumn();
              if (!$payload) { echo "LAB_DIAG_NO_ANALYSIS\n"; exit; }
              $data = json_decode($payload, true, 512, JSON_THROW_ON_ERROR);
              $analysis = $data['analysis'];
              foreach ($analysis['matches'] as &$m) { $m['country'] = trim((string)($data['tables']['stats']['rows'][$m['row']-1][0]??'')); } unset($m);
              $fresh = \StratEdgeLab\FootyStats::configured(new \StratEdgeLab\Store($db))->enrich($analysis);
              echo 'LAB_FIXED_COUNTS ' . json_encode($fresh['footystats'], JSON_UNESCAPED_UNICODE) . "\n";
              foreach ($fresh['matches'] as $i=>$m) {
                  if ($i<3 || $m['footystats']['status']!=='enriched') { echo 'LAB_FIXED_ROW ' . json_encode(['row'=>$i+1,'home'=>$m['home'],'away'=>$m['away'],'status'=>$m['footystats']['status'],'message'=>$m['footystats']['message'],'home_n'=>$m['footystats']['home']['n']??null,'away_n'=>$m['footystats']['away']['n']??null],JSON_UNESCAPED_UNICODE) . "\n"; }
              }
              $cache = $db->query("SELECT payload FROM se_lab_api_cache WHERE expires_at > UNIX_TIMESTAMP()")->fetchAll(PDO::FETCH_COLUMN);
              foreach ($cache as $entry) {
                  $response = json_decode($entry,true);
                  foreach ($response['data']??[] as $f) {
                      if (isset($f['homeID']) && preg_match('/Midtjylland|Br.ndby|Pe.arol|Albion|Barcelona|Delfin|Libertad|del Valle/i', ($f['home_name']??'').' '.($f['away_name']??''))) {
                          echo 'LAB_REMAINING_NAMES ' . json_encode(array_intersect_key($f,array_flip(['id','homeID','awayID','home_name','away_name','date_unix','competition_id'])),JSON_UNESCAPED_UNICODE) . "\n";
                      }
                  }
              }
          } catch (Throwable $e) { echo "LAB_DIAG_FAILED\n"; exit(2); }
          PHP
          REMOTE
